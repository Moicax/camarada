# Publica o banco de dados e as funções no Supabase sempre que algo em supabase/ muda.
# Segredos necessários (GitHub → Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF, SUPABASE_DB_PASSWORD,
#   VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY, VAPID_SUBJECT, CRON_SECRET
name: Publicar servidor
on:
  push:
    branches: [main]
    paths: ['supabase/**']
  workflow_dispatch:
jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJETO: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase link --project-ref "$PROJETO"
      - run: supabase db push
      - run: |
          supabase secrets set --project-ref "$PROJETO" \
            VAPID_PUBLIC_KEY="${{ secrets.VAPID_PUBLIC_KEY }}" \
            VAPID_PRIVATE_KEY="${{ secrets.VAPID_PRIVATE_KEY }}" \
            VAPID_SUBJECT="${{ secrets.VAPID_SUBJECT }}" \
            CRON_SECRET="${{ secrets.CRON_SECRET }}"
      - run: supabase functions deploy registrar-compra --no-verify-jwt --project-ref "$PROJETO"
      - run: supabase functions deploy notificar --no-verify-jwt --project-ref "$PROJETO"
