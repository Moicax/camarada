# Compra de teste (R$ 1,00) na conta do dono; apaga sozinha depois de 15 minutos.
name: Compra de teste
on:
  push:
    branches: [teste-compra]
permissions:
  contents: read
env:
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
jobs:
  lancar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/teste-compra.mjs lancar
  apagar:
    needs: lancar
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sleep 900
      - run: node scripts/teste-compra.mjs apagar
